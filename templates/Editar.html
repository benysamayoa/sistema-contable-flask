<!DOCTYPE html>
<html>
<head>
    <title>Editar Jornalización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            max-width: 600px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .title {
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>

<body class="p-4">

<div class="card p-4">

    <h3 class="title mb-4">✏️ Editar Partida Contable</h3>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Cuenta</label>
            <input type="text" name="cuenta" class="form-control"
                   value="{{ dato[2] }}" required>
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Debe</label>
                <input type="number" step="0.01" name="debe" class="form-control"
                       value="{{ dato[3] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Haber</label>
                <input type="number" step="0.01" name="haber" class="form-control"
                       value="{{ dato[4] }}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3">{{ dato[5] }}</textarea>
        </div>

        <div class="d-flex justify-content-between">

            <a href="/ver_jornalizacion" class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-success">
                Guardar cambios
            </button>

        </div>

    </form>

</div>

</body>
</html>
