<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4e73df,#1cc88a);
}
.card{
width:350px;
animation:fadeIn 0.7s;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}
</style>
</head>
<body>

<div class="card p-4 shadow">
<h3 class="text-center">Login</h3>

<form method="POST">
<input name="username" class="form-control mb-2" placeholder="Usuario">
<input name="password" type="password" class="form-control mb-3" placeholder="Contraseña">
<button class="btn btn-primary w-100">Entrar</button>
</form>

<a href="/register" class="text-center mt-2 d-block">Crear cuenta</a>
</div>

</body>
</html>
