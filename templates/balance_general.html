<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Balance General</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">
        🏦 Balance General
    </h1>

    <!-- BOTONES -->
    <div class="mb-4">

        <a href="/dashboard" class="btn btn-secondary">
            ⬅ Volver
        </a>

        <a href="/estado_resultados" class="btn btn-info">
            📈 Estado Resultados
        </a>

    </div>

    <!-- TABLA -->
    <div class="card shadow">

        <div class="card-body">

            <table class="table table-bordered table-hover text-center">

                <thead class="table-dark">

                    <tr>
                        <th>Cuenta</th>
                        <th>Total</th>
                    </tr>

                </thead>

                <tbody>

                    <!-- ACTIVOS -->
                    <tr class="table-primary">

                        <td>
                            Activos
                        </td>

                        <td>
                            Q {{ activos }}
                        </td>

                    </tr>

                    <!-- PASIVOS -->
                    <tr class="table-warning">

                        <td>
                            Pasivos
                        </td>

                        <td>
                            Q {{ pasivos }}
                        </td>

                    </tr>

                    <!-- CAPITAL -->
                    <tr class="table-success">

                        <td>
                            Capital
                        </td>

                        <td>
                            Q {{ capital }}
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<div class="container mt-4">

    <div class="row g-3">

        <!-- JORNALIZACION -->
        <div class="col-md-3">
            <a href="/jornalizacion" class="btn btn-primary w-100 p-3">
                📘 Jornalización
            </a>
        </div>

        <!-- DIARIO MAYOR -->
        <div class="col-md-3">
            <a href="/diario_mayor" class="btn btn-success w-100 p-3">
                📖 Diario Mayor
            </a>
        </div>

        <!-- BALANCE DE SALDOS -->
        <div class="col-md-3">
            <a href="/balance_saldos" class="btn btn-warning w-100 p-3">
                📊 Balance de Saldos
            </a>
        </div>


        <!-- ESTADOS FINANCIEROS -->
        <div class="col-md-3">
            <a href="/estados_financieros" class="btn btn-secondary w-100 p-3">
                📋 Estados Financieros
            </a>
        </div>

         <!-- BALANCE GENERAL -->
        <div class="col-md-3">
            <a href="/balance_general" class="btn btn-dark w-100 p-3">
                🏦 Balance General
            </a>
        </div>
    

        <!-- ESTADO RESULTADOS -->
        <div class="col-md-3">
            <a href="/estado_resultados" class="btn btn-info w-100 p-3">
                📈 Estado de Resultados
            </a>
        </div>

       

    </div>

</div>



</body>
</html>
