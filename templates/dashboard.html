<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card:hover{
    transform: scale(1.05);
    transition: 0.3s;
}
</style>

</head>
<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center">
    <h2>Bienvenido {{ user }}</h2>
    <a href="/logout" class="btn btn-danger">Cerrar sesión</a>
</div>

<hr>

<div class="row g-4">

    <!-- Jornalización -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Jornalización</h5>
            <p>Registrar transacciones</p>
            <a href="/jornalizacion" class="btn btn-primary">Entrar</a>
        </div>
    </div>

    <!-- Diario Mayor -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Diario Mayor</h5>
            <p>Próximamente</p>
            <a href="/diario_mayor" class="btn btn-secondary">Entrar</a>
        </div>
    </div>

    <!-- Balance de Saldos -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Balance de Saldos</h5>
            <p>Próximamente</p>
            <a href="/balance_saldos" class="btn btn-secondary">Entrar</a>
        </div>
    </div>

    <!-- Estados Financieros -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Estados Financieros</h5>
            <p>Próximamente</p>
            <a href="/estados_financieros" class="btn btn-secondary">Entrar</a>
        </div>
    </div>

    <!-- Balance General -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Balance General</h5>
            <p>Próximamente</p>
            <a href="/balance_general" class="btn btn-secondary">Entrar</a>
        </div>
    </div>

    <!-- Estado de Resultados -->
    <div class="col-md-4">
        <div class="card shadow text-center p-3">
            <h5>Estado de Resultados</h5>
            <p>Próximamente</p>
            <a href="/estado_resultados" class="btn btn-secondary">Entrar</a>
        </div>
    </div>

</div>

</div>

</body>
</html>
