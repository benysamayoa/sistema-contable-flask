<!DOCTYPE html>
<html>
<head>

   

<div class="mb-3">

    <h5>📊 Filtros de Jornalización</h5>

    <div class="d-flex flex-wrap gap-2 align-items-end">

        <!-- 📅 DÍA -->
        <form method="GET" action="/ver_jornalizacion" class="d-flex gap-1">
            <input type="date" name="fecha" class="form-control" style="width: 160px;">
            <button class="btn btn-primary">Día</button>
        </form>


         <!-- 📊 SEMANA -->
        <form method="GET" action="/ver_jornalizacion" class="d-flex gap-1">
            <input type="week" name="semana" class="form-control" style="width: 160px;">
            <button class="btn btn-warning">Semana</button>
        </form>


        <!-- 📆 MES -->
        <form method="GET" action="/ver_jornalizacion" class="d-flex gap-1">
            <input type="month" name="mes" class="form-control" style="width: 160px;">
            <button class="btn btn-success">Mes</button>
        </form>

        <!-- 🗓 AÑO -->
        <form method="GET" action="/ver_jornalizacion" class="d-flex gap-1">
            <input type="number" name="anio" placeholder="Año (2026)" class="form-control" style="width: 120px;">
            <button class="btn btn-dark">Año</button>
        </form>

       
        <!-- 🔁 TODO -->
        <a href="/ver_jornalizacion" class="btn btn-secondary">
            Todo
        </a>

    </div>
</div>

            <th>Haber</th>
            <th>Descripción</th>

    </thead>

    <tbody>
        {% for d in datos %}
        <tr>
            <td>{{ d.id }}</td>
            <td>{{ d.fecha }}</td>
            <td>{{ d.cuenta }}</td>
            <td>{{ d.debe }}</td>
            <td>{{ d.haber }}</td>
            <td>{{ d.descripcion }}</td>

            <td>
                <a href="/editar/{{ d.id }}" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <!-- OPCIONAL: eliminar -->
                <a href="/eliminar/{{ d.id }}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar esta partida?')">
                    Eliminar
                </a>

        </tr>

    </tbody>
</table>

</body>
</html>
