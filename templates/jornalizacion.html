<!DOCTYPE html>
<html>
<head>
<title>Jornalización</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Jornalización</h2>
<a href="/dashboard" class="btn btn-secondary mb-3">Volver</a>

<form method="POST" class="mb-4">

<h5>Cuenta DEBE</h5>
<input type="text" name="cuenta_debe" class="form-control mb-2" placeholder="Cuenta">
<input type="number" step="any" name="debe" class="form-control mb-2" placeholder="Monto">

<h5>Cuenta HABER</h5>
<input type="text" name="cuenta_haber" class="form-control mb-2" placeholder="Cuenta">
<input type="number" step="any" name="haber" class="form-control mb-2" placeholder="Monto">

<input type="date" name="fecha" class="form-control mb-2">
<input type="text" name="descripcion" class="form-control mb-2" placeholder="Descripción">

<button class="btn btn-success">Guardar Partida</button>

</form>

<hr>

<h4>Libro Diario</h4>

<table class="table table-bordered">
<tr>
    <th>ID</th>
    <th>Fecha</th>
    <th>Cuenta</th>
    <th>Debe</th>
    <th>Haber</th>
    <th>Descripción</th>
</tr>

{% for fila in datos %}
<tr>
    <td>{{ fila[0] }}</td>
    <td>{{ fila[1] }}</td>
    <td>{{ fila[2] }}</td>
    <td>{{ fila[3] }}</td>
    <td>{{ fila[4] }}</td>
    <td>{{ fila[5] }}</td>
</tr>
{% endfor %}

</table>
    <div class="mt-4">

    <a href="/diario_mayor" class="btn btn-primary">
        📘 Mandar a Libro Diario
    </a>

</div>

</body>
</html>
