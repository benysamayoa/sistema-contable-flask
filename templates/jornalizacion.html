<!DOCTYPE html>
<html>
<head>
    <title>Jornalización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h2>Jornalización</h2>
    <a href="/dashboard" class="btn btn-secondary mb-3">Volver</a>

    <form method="POST" class="mb-4">

        <h5 class="mt-3">Cuenta DEBE</h5>
        <input type="text" name="cuenta_debe" id="nombre_cuenta_debe" list="lista_cuentas_autocompletar" class="form-control mb-2" placeholder="Nombre de la cuenta" required>
        <input type="text" name="tipo_debe" id="sugerencia_debe" class="form-control mb-2" placeholder="Tipo de cuenta..." readonly style="background-color: #f8f9fa; font-weight: bold;">
        <input type="number" step="any" name="debe" class="form-control mb-2" placeholder="Monto Q.">

        <h5 class="mt-3">Cuenta HABER</h5>
        <input type="text" name="cuenta_haber" id="nombre_cuenta_haber" list="lista_cuentas_autocompletar" class="form-control mb-2" placeholder="Nombre de la cuenta" required>
        <input type="text" name="tipo_haber" id="sugerencia_haber" class="form-control mb-2" placeholder="Tipo de cuenta..." readonly style="background-color: #f8f9fa; font-weight: bold;">
        <input type="number" step="any" name="haber" class="form-control mb-2" placeholder="Monto Q.">

        <h5 class="mt-3">Información General</h5>
        <input type="date" name="fecha" class="form-control mb-2" required>
        <input type="text" name="descripcion" class="form-control mb-2" placeholder="Descripción de la partida" required>

        <datalist id="lista_cuentas_autocompletar">
            {% for nombre in lista_nombres %}
                <option value="{{ nombre }}">
            {% endfor %}
        </datalist>

        <button type="submit" class="btn btn-success w-100">Guardar Partida</button>
    </form>

    <hr>

    <h4>Libro Diario</h4>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cuenta</th>
                <th>Debe</th>
                <th>Haber</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in datos %}
            <tr>
                <td>{{ fila[0] }}</td>
                <td>{{ fila[1] }}</td>
                <td>{{ fila[2] }}</td>
                <td>{{ fila[3] }}</td>
                <td>{{ fila[4] }}</td>
                <td>{{ fila[5] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="mt-4">
        <a href="/diario_mayor" class="btn btn-primary">
            📘 Mandar a Libro Diario
        </a>
    </div>

    <script>
        function configurarSugerencia(idInput, idResultado) {
            const input = document.getElementById(idInput);
            const resultado = document.getElementById(idResultado);

            // Escucha en tiempo real mientras el usuario escribe cada letra
            input.addEventListener('input', function() {
                const nombre = this.value.trim(); 
                
                if (nombre.length > 1) {
                    fetch(`/sugerir_tipo?nombre=${encodeURIComponent(nombre)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.tipo_sugerido !== "No encontrada") {
                                resultado.value = data.tipo_sugerido;
                            }
                        })
                        .catch(err => console.error("Error al sugerir:", err));
                } else {
                    resultado.value = ""; // Limpia la casilla si borras el texto
                }
            });
        }

        // Activamos los listeners para los inputs correspondientes
        configurarSugerencia('nombre_cuenta_debe', 'sugerencia_debe');
        configurarSugerencia('nombre_cuenta_haber', 'sugerencia_haber');
    </script>

</body>
</html>
